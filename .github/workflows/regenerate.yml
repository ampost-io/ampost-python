# Once a day: regenerate from the live https://api.ampost.io/openapi.json and open a pull request
# when the API changed. Needs the repo setting "Allow GitHub Actions to create pull requests".
name: Regenerate from OpenAPI

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run python scripts/generate.py --spec https://api.ampost.io/openapi.json
      - run: uv run pytest && uv run mypy
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: regenerate-openapi
          commit-message: "chore: regenerate from openapi.json"
          title: "Regenerate from the current Ampost OpenAPI document"
          body: "Generated by the daily Regenerate from OpenAPI workflow. Bump the version in pyproject.toml and src/ampost/_version.py before publishing."
